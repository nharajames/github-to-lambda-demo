version: 0.2

env:
  variables:
    S3_BUCKET: "function-sample-signer-bucket"
    UNSIGNED_KEY: "unsigned-code/deployment_package.zip"
    SIGNED_PREFIX: "signed-code/"
    LAMBDA_FUNCTION_NAME: "github-to-lambda-demo"
    SIGNING_PROFILE: "github_to_lambda_demo_signer"

phases:
  install:
    runtime-versions:
      python: 3.11
    commands:
      - pip install -r requirements.txt -t .
  build:
    commands:
      - echo "Building deployment package..."
      - zip -r deployment_package.zip .
      - echo "Uploading unsigned package to S3..."
      - aws s3 cp deployment_package.zip s3://$S3_BUCKET/$UNSIGNED_KEY
      - echo "Enabling versioning on S3 bucket..."
      - aws s3api put-bucket-versioning --bucket $S3_BUCKET --versioning-configuration Status=Enabled
  post_build:
    commands:
      - echo "Getting latest version ID..."
      - VERSION_ID=$(aws s3api list-object-versions --bucket $S3_BUCKET --prefix $UNSIGNED_KEY --query 'Versions[?IsLatest==`true`].VersionId' --output text)
      - echo "Starting AWS Signer job..."
      - SIGNING_JOB_ID=$(aws signer start-signing-job \
          --source "{\"s3\":{\"bucketName\":\"$S3_BUCKET\",\"key\":\"$UNSIGNED_KEY\",\"version\":\"$VERSION_ID\"}}" \
          --destination "{\"s3\":{\"bucketName\":\"$S3_BUCKET\",\"prefix\":\"$SIGNED_PREFIX\"}}" \
          --profile-name $SIGNING_PROFILE \
          --client-request-token "$(date +%s)" \
          --query 'JobId' --output text)
      - echo "Signer Job ID: $SIGNING_JOB_ID"
      - echo "Waiting for signing to complete..."
      - |
        STATUS=""
        while [ "$STATUS" != "Succeeded" ]; do
          STATUS=$(aws signer describe-signing-job --job-id $SIGNING_JOB_ID --query 'status' --output text)
          echo "Current status: $STATUS"
          if [ "$STATUS" == "Failed" ]; then
            echo "Signer job failed!"
            exit 1
          fi
          sleep 10
        done
      - echo "Signing completed, updating Lambda function..."
      - SIGNED_KEY="${SIGNED_PREFIX}$(basename $UNSIGNED_KEY)"
      - aws lambda update-function-code \
          --function-name $LAMBDA_FUNCTION_NAME \
          --s3-bucket $S3_BUCKET \
          --s3-key $SIGNED_KEY
      - echo "Lambda updated successfully!"

artifacts:
  files:
    - deployment_package.zip

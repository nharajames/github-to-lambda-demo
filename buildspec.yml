version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.9
    commands:
      - pip install -r requirements.txt -t .
  build:
    commands:
      - echo "Packaging Lambda..."
      - zip -r deployment_package.zip .
      - echo "Uploading to S3..."
      - aws s3 cp deployment_package.zip s3://function-sample-signer-bucket/unsigned-code/deployment_package.zip
  post_build:
    commands:
      - echo "Getting S3 object version..."
      - VERSION_ID=$(aws s3api list-object-versions --bucket function-sample-signer-bucket --prefix unsigned-code/deployment_package.zip --query 'Versions[?IsLatest==`true`].VersionId' --output text)
      - echo "Starting AWS Signer job..."
      - aws signer start-signing-job --source "{\"s3\":{\"bucketName\":\"function-sample-signer-bucket\",\"key\":\"unsigned-code/deployment_package.zip\",\"version\":\"$VERSION_ID\"}}" --destination "{\"s3\":{\"bucketName\":\"function-sample-signer-bucket\",\"prefix\":\"signed-code/\"}}" --profile-name github_to_lambda_demo_signer --client-request-token "$(date +%s)"

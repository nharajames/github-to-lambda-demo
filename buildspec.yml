version: 0.2

env:
  variables:
    S3_BUCKET: "function-sample-signer-bucket"
    UNSIGNED_KEY: "unsigned-code/deployment_package.zip"
    SIGNED_PREFIX: "signed-code/"
    LAMBDA_FUNCTION_NAME: "github-to-lambda-demo"

phases:
  install:
    runtime-versions:
      python: 3.11
    commands:
      - echo "Installing dependencies..."
      - pip install --upgrade pip
      - pip install -r requirements.txt -t .

  pre_build:
    commands:
      - echo "Cleaning previous deployment package..."
      - rm -f deployment_package.zip

  build:
    commands:
      - echo "Packaging Lambda function..."
      - zip -r deployment_package.zip .

  post_build:
    commands:
      - echo "Uploading unsigned code to S3..."
      - aws s3 cp deployment_package.zip s3://$S3_BUCKET/$UNSIGNED_KEY

      - echo "Ensuring bucket versioning is enabled..."
      - |
        aws s3api put-bucket-versioning \
          --bucket $S3_BUCKET \
          --versioning-configuration Status=Enabled || echo "Versioning already enabled"

      - echo "Fetching latest object version ID..."
      - |
        VERSION_ID=$(aws s3api list-object-versions \
          --bucket $S3_BUCKET \
          --prefix $UNSIGNED_KEY \
          --query 'Versions[?IsLatest].VersionId' \
          --output text)
        echo "Version ID: $VERSION_ID"

      - echo "Starting AWS Signer job..."
      - |
        aws signer start-signing-job \
          --source "{\"s3\":{\"bucketName\":\"$S3_BUCKET\",\"key\":\"$UNSIGNED_KEY\",\"version\":\"$VERSION_ID\"}}" \
          --destination "{\"s3\":{\"bucketName\":\"$S3_BUCKET\",\"prefix\":\"$SIGNED_PREFIX\"}}" \
          --client-request-token "$(date +%s)"

      - echo "Waiting for signing to complete..."
      - |
        SIGNED_KEY=$(aws s3 ls s3://$S3_BUCKET/$SIGNED_PREFIX --recursive | awk '{print $4}' | sort | tail -n1)
        echo "Signed artifact: $SIGNED_KEY"

      - echo "Updating Lambda function with signed code..."
      - aws lambda update-function-code \
          --function-name $LAMBDA_FUNCTION_NAME \
          --s3-bucket $S3_BUCKET \
          --s3-key $SIGNED_KEY

artifacts:
  files:
    - deployment_package.zip
